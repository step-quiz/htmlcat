# Executa tots els tests d'HTMLCat a cada push i a cada pull request.
# Resultats: pestanya «Actions» del repositori a GitHub.
name: Comprova HTMLCat

on:
  push:
  pull_request:
  # També el llança unzip-upload.yml després de desar un ZIP (un commit del
  # bot no dispara cap workflow per si sol).
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests unitaris
        run: node --test tests/unit/*.test.mjs

      - name: Comprovacions estàtiques del web
        run: node tests/course-static.mjs

      - name: Instal·la Playwright
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Comprovacions amb navegador
        working-directory: tests
        run: node course-browser.mjs
