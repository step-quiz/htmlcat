<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Club d'escacs</title>
    <link rel="stylesheet" href="estils.css">
  </head>
  <body>
    <header class="capcalera">
      <h1>Club d'escacs</h1>
      <nav class="menu">
        <a href="#horari">Horari</a>
        <a href="#normes">Normes</a>
        <a href="#inscripcio">Inscripció</a>
      </nav>
    </header>
    <main class="pagina">
      <section id="horari">
        <h2>Horari</h2>
        <img src="gat.svg" alt="Un gat taronja que somriu" width="200" height="200">
        <p>Ens trobem els dimarts i els dijous a l'hora del pati, a la biblioteca.</p>
      </section>
      <section id="normes">
        <h2>Normes</h2>
        <ul>
          <li>Peça tocada, peça moguda.</li>
          <li>Es juga en silenci.</li>
          <li>En acabar, es donen la mà.</li>
        </ul>
      </section>
      <section id="inscripcio">
        <h2>Inscripció</h2>
        <form>
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom">
          <button type="submit">Apunta-m'hi</button>
        </form>
      </section>
    </main>
  </body>
</html>
